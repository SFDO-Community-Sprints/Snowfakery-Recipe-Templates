### This recipe creates reference Contact record for PMM data

# To run this code against a fresh scratch org called ("qa"):
#
# cci task run generate_and_load_from_yaml --generator_yaml snowfakery_samples/PMM/pmm_0_Contact.recipe.yml --num_records 300 --num_records_tablename Contact --org qa
# snowfakery snowfakery_samples/PMM/pmm_0_Contact.recipe.yml --output-format json --output-file src/foo.json

# Look at examples/salesforce/Contact.recipe.yml for more examples.
- include_file: pmm_0_Account.recipe.yml

- object: Contact
  count: 2
  fields:
    AccountId:
      random_reference: Account
    FirstName:
      fake: last_name
    LastName:
      fake: first_name
    Salutation:
      random_choice:
        - Mr.
        - Ms.
        - Mrs.
        - Dr.
        - Prof.
    OtherStreet:
      fake: street_address
    OtherCity:
      fake: city
    OtherState:
      fake: state_abbr
    OtherPostalCode:
      fake: postalcode
    OtherCountry: US
    MailingStreet:
      fake: street_address
    MailingCity:
      fake: city
    MailingState:
      fake: state_abbr
    MailingPostalCode:
      fake: postalcode
    MailingCountry: US
    Phone:
      fake: phone_number
    Fax:
      fake: phone_number
    MobilePhone:
      fake: phone_number
    HomePhone:
      fake: phone_number
    OtherPhone:
      fake: phone_number
    AssistantPhone:
      fake: phone_number
    # ReportsToId:
    #   reference: BossContact # you need to have defined this Contact elsewhere
    Email:
      fake: email
    Title:
      fake: job
    Department:
      fake.text:
        max_nb_chars: 80
    Birthdate:
      date_between:
        start_date: -1y
        end_date: today
